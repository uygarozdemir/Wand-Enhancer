name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish a release for (e.g. v2.0.0.0)'
        required: true
        type: string

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release-metadata.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Extract release notes from changelog
        shell: pwsh
        run: ./scripts/get-changelog-section.ps1 -Version $env:RELEASE_VERSION -OutputPath release-notes.md

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          body_path: release-notes.md
          files: |
            CHANGELOG.md
            WandEnhancer/bin/Release/WandEnhancer.exe
          fail_on_unmatched_files: true
          # RC tags must not replace the latest stable release.
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          make_latest: ${{ !contains(env.RELEASE_VERSION, '-') }}
